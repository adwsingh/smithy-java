// Gradle init script used by scripts/codegen-size/measure.sh and the "Codegen Size" workflow.
//
// It registers two helper tasks on :codegen:codegen-plugin. They live in an init script rather
// than in the build so that they can be applied to any checkout of the repository, in particular
// to the base commit of a pull request, which may not contain these scripts:
//
//   codegenSizeClasspath -PcodegenSizeClasspathFile=<file>
//       Writes the classpath needed to run the codegen plugin and to compile the code it
//       generates (the plugin's classes, its runtime classpath and the "it" runtime classpath,
//       without any test classes), building what is needed first.
//
//   codegenSizeModel -PcodegenSizeModelFile=<file> [-PcodegenSizeModelArtifact=ec2]
//       Copies an AWS API model jar, at the version pinned by the aws-api-models BOM in the
//       version catalog, to the given file.
//
// Usage: ./gradlew -I scripts/codegen-size/codegen-size.init.gradle :codegen:codegen-plugin:<task> -P...

import org.gradle.api.artifacts.VersionCatalogsExtension

allprojects {
    if (path != ':codegen:codegen-plugin') {
        return
    }
    afterEvaluate {
        tasks.register('codegenSizeClasspath') {
            description = 'Writes the classpath for running the codegen plugin and compiling its output'
            def classpath = project.sourceSets.main.output + project.configurations.runtimeClasspath + project.configurations.itRuntimeClasspath
            def outputFile = project.findProperty('codegenSizeClasspathFile')
            inputs.files(classpath)
            doLast {
                if (outputFile == null) {
                    throw new GradleException('-PcodegenSizeClasspathFile=<file> is required')
                }
                def file = new File(outputFile.toString())
                file.parentFile?.mkdirs()
                file.text = classpath.files.collect { it.absolutePath }.join(File.pathSeparator)
            }
        }

        tasks.register('codegenSizeModel') {
            description = 'Copies an AWS API model jar at the version pinned by the aws-api-models BOM'
            def outputFile = project.findProperty('codegenSizeModelFile')
            def artifact = project.findProperty('codegenSizeModelArtifact') ?: 'ec2'
            def catalog = project.extensions.getByType(VersionCatalogsExtension).named('libs')
            def bomVersion = catalog.findVersion('aws-api-models').get().requiredVersion
            def configuration = project.configurations.detachedConfiguration(
                    project.dependencies.platform("software.amazon.api.models:all:$bomVersion"),
                    project.dependencies.create("software.amazon.api.models:$artifact"))
            // Only file collections are used at execution time, which keeps the task compatible
            // with the configuration cache.
            def modelJars = configuration.incoming.files
            inputs.files(modelJars)
            doLast {
                if (outputFile == null) {
                    throw new GradleException('-PcodegenSizeModelFile=<file> is required')
                }
                def jar = modelJars.files.find { it.name.endsWith('.jar') }
                if (jar == null) {
                    throw new GradleException("could not resolve software.amazon.api.models:$artifact")
                }
                def file = new File(outputFile.toString())
                file.parentFile?.mkdirs()
                java.nio.file.Files.copy(jar.toPath(), file.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("Resolved ${jar.name} to ${file}")
            }
        }
    }
}
