name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    name: Auto-format
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Cache compiled buildscripts
        uses: actions/cache@v6
        with:
            key: ${{ runner.os }}-gradle-${{ hashFiles('buildSrc/**/*.kts') }}
            path: |
              ./buildSrc/build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches

      - name: Run spotlessApply
        run: ./gradlew spotlessApply

      - name: Commit formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-format: apply spotless formatting"
            git push
          fi

  build:
    runs-on: ${{ matrix.os }}
    name: Java ${{ matrix.java }} ${{ matrix.os }}
    needs: [format]
    if: always()
    strategy:
      matrix:
        java: [21]
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'

      - name: Cache compiled buildscripts
        uses: actions/cache@v6
        with:
            key: ${{ runner.os }}-gradle-${{ hashFiles('buildSrc/**/*.kts') }}
            path: |
              ./buildSrc/build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches

      - name: Clean, build and javadoc
        run: ./gradlew clean build javadoc -Plog-tests --stacktrace

      - name: Integration tests
        run: ./gradlew integ -Plog-tests --stacktrace

      - name: Allow long file names in git for windows
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: java-${{ matrix.java }}-${{ matrix.os }}-test-report
          path: '**/build/reports/tests'
